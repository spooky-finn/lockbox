name: Set up Rust desktop build
description: Install native dependencies, the pinned toolchain, and a dependency cache.
inputs:
  cache-key:
    description: Separate caches for validation and release profiles.
    required: true
runs:
  using: composite
  steps:
    - name: Install Linux desktop dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev \
          libssl-dev librsvg2-dev libayatana-appindicator3-dev dpkg-dev
    - name: Install pinned Rust toolchain
      shell: bash
      run: rustup show active-toolchain
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}
        save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
