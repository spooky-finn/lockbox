name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Formatting and browser companion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # The companion has no npm dependencies or lockfile; no install is needed.
      - name: Check and build browser companion
        run: npm --prefix ext run check:build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: checks
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: tools/storj-issuer/go.sum
      - name: Check Storj issuer
        working-directory: tools/storj-issuer
        run: |
          test -z "$(gofmt -l main.go main_test.go)"
          go vet ./...
          go test -mod=readonly ./...
      - name: Check all Rust targets
        run: cargo clippy --locked --all-targets -- -D warnings

  ci:
    name: CI passed
    if: always()
    needs: [quality, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$RUST_RESULT" = success
