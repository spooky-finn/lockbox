name: Release
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching Cargo.toml and ext/manifest.json (for example, 0.1.0)
        required: true
        type: string
      draft:
        description: Create an unpublished draft
        type: boolean
        default: true
      prerelease:
        description: Mark as a prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate branch, versions, and unused tag
        id: metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-metadata.py

  checks:
    name: Release validation
    needs: prepare
    uses: ./.github/workflows/ci.yml

  native:
    name: Build ${{ matrix.target }}
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_STRIP: symbols
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release
      - name: Build desktop and native browser host
        run: cargo build --locked --release --bin lockbox --bin lockbox-browser-host
      - name: Smoke test optimized native browser host
        run: python3 .github/scripts/smoke-native-host.py target/release/lockbox-browser-host
      - name: Package native release
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: bash .github/scripts/package-native.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: target/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  browser:
    name: Package browser companions
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Package Chrome and Firefox extensions
        run: npm --prefix ext run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-browser
          path: ext/dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Create GitHub release
    needs: [prepare, native, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Recheck tag before publication
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-metadata.py
      - name: Verify release assets and generate checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 .github/scripts/verify-release-assets.py release-assets "$RELEASE_VERSION"
          cd release-assets
          sha256sum ./* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create release at the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [[ "$RELEASE_DRAFT" == true ]]; then flags+=(--draft); fi
          if [[ "$RELEASE_PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$GITHUB_SHA" --title "Lockbox $RELEASE_TAG" \
            --generate-notes --notes-file .github/release-notes.md "${flags[@]}"
          {
            printf '### Release %s\n\n' "$RELEASE_TAG"
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            gh release view "$RELEASE_TAG" --json url --jq .url
          } >> "$GITHUB_STEP_SUMMARY"
