[package]
name = "lockbox"
version = "0.1.0"
edition = "2024"
publish = false
# `cargo run` starts the app; `build-icons` regenerates assets/icons.jsonl.
default-run = "lockbox"
description = "Local password manager with TOTP"

# UI assets are bundled locally; no remote content is loaded.
[dependencies]
arboard = "3.7.0"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
dirs = "6"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
hpke = { version = "=0.13.0", default-features = false, features = ["alloc", "x25519"] }
dioxus = { version = "0.7", features = ["desktop"] }
tokio = { version = "1", features = ["time"] }
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
resvg = { version = "0.49", default-features = false }
rfd = "0.17"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
# hpke disables dalek defaults; explicitly retain private-key wiping.
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
url = "2"
zeroize = { version = "1.8", features = ["derive", "serde"] }
rmcp = { version = "3.8.0", features = ["server"] }
rand_core = { version = "0.9", features = ["os_rng"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
quick-xml = { version = "0.41", features = ["serialize"] }
serde_jcs = "0.2"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
dioxus-ssr = "0.7"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
security-framework = "3"
