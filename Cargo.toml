[package]
name = "lockbox"
version = "0.1.0"
edition = "2024"
publish = false
# `cargo run` starts the app; `build-icons` regenerates assets/icons.jsonl.
default-run = "lockbox"
description = "Local-first, serverless password manager for teams, powered by S3-compatible storage"

# Brand icons are bundled; website icons require an explicit opt-in.
[dependencies]
arboard = "3.7.0"
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
bip39 = { version = "=2.2.2", features = ["zeroize"] }
chacha20poly1305 = "0.10"
dirs = "6"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
hpke = { version = "=0.13.0", default-features = false, features = ["alloc", "x25519"] }
dioxus = { version = "0.7", features = ["desktop"] }
tokio = { version = "1", features = ["time", "rt", "net"] }
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
resvg = { version = "0.49", default-features = false }
rfd = "0.17"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
# hpke disables dalek defaults; explicitly retain private-key wiping.
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
url = "2"
kuchikiki = "=0.8.8-speedreader"
zeroize = { version = "1.8", features = ["derive", "serde"] }
rmcp = { version = "3.8.0", features = ["server"] }
rand_core = { version = "0.9", features = ["os_rng"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_jcs = "0.2"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
aws-smithy-types = "1"

[dev-dependencies]
dioxus-ssr = "0.7"
tempfile = "3"

[build-dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
security-framework = { version = "3", features = ["OSX_10_15"] }
core-foundation = "0.10"
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }
