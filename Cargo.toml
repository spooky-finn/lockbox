[package]
name = "lockbox"
version = "0.1.0"
edition = "2024"
publish = false
description = "Local password manager with TOTP"

# No networking crates: lockbox never talks to the network.
[dependencies]
arboard = "3.7.0"
argon2 = "0.5"
chacha20poly1305 = "0.10"
dirs = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "clipboard", "wayland", "x11"] }
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
rfd = "0.17"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
