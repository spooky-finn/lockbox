[package]
name = "lockbox"
version = "0.1.0"
edition = "2024"
publish = false
description = "Local password manager with TOTP"

# No networking crates: lockbox never talks to the network.
[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.3"
hkdf = "0.12"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
